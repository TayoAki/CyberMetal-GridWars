<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Check</title>
<style>
  :root { --bg: #0e1220; --fg: #dfe6ff; --dim: #8a94b8; --ok: #5fd38a; --bad: #ff6b6b; --warn: #ffc857; --line: #273050; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; max-width: 980px; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; }
  td.num { text-align: right; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  button { background: #1b2340; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; margin: 2px; font: inherit; cursor: pointer; }
  #listen { margin: 12px 0; max-width: 980px; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Audio check</h1>
<p id="status">Rendering every sound offline...</p>
<div id="listen"></div>
<div class="wrap"><table id="out"><thead><tr><th>kind</th><th>name</th><th>dur s</th><th>peak</th><th>rms</th><th>NaN</th><th>result</th><th>note</th></tr></thead><tbody></tbody></table></div>
<script type="module">
import { audio, SFX_NAMES, TRACK_NAMES, trackInfo } from '../src/audio/index.js';

const SILENT = 0.001; // -60 dBFS: where a sound counts as over
const SFX_MIN_RMS = 0.003;
const MUSIC_MIN_RMS = 0.01;
const LONG_OK = new Set(['playerdelete']); // allowed past 1.2 s
const results = [];
const tbody = document.querySelector('#out tbody');

// Mono mix helper and measurements over [from, to) seconds.
function stats(buf, from = 0, to = buf ? buf.duration : 0) {
  if (!buf) return null;
  const sr = buf.sampleRate;
  const chans = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
  const i0 = Math.max(0, Math.floor(from * sr));
  const i1 = Math.min(buf.length, Math.floor(to * sr));
  let peak = 0, sum = 0, n = 0, nan = false, lastLoud = -1;
  for (let i = i0; i < i1; i++) {
    for (const d of chans) {
      const x = d[i];
      if (x !== x) { nan = true; continue; }
      const a = Math.abs(x);
      if (a > peak) peak = a;
      if (a > SILENT) lastLoud = i;
      sum += x * x;
      n++;
    }
  }
  return { peak, rms: Math.sqrt(sum / Math.max(1, n)), nan, end: (lastLoud + 1) / sr };
}

// Longest stretch (s) of near-silence inside [from, to): 50 ms windows under -54 dBFS RMS.
function longestGap(buf, from = 0, to = buf.duration) {
  const sr = buf.sampleRate, w = Math.floor(0.05 * sr);
  const chans = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
  let run = 0, best = 0;
  for (let i = Math.floor(from * sr); i + w <= Math.min(buf.length, Math.floor(to * sr)); i += w) {
    let sum = 0;
    for (const d of chans) for (let j = i; j < i + w; j++) sum += d[j] * d[j];
    if (Math.sqrt(sum / (w * chans.length)) < 0.002) best = Math.max(best, (run += 0.05));
    else run = 0;
  }
  return best;
}

function mono(buf, from, len) {
  const sr = buf.sampleRate, i0 = Math.floor(from * sr), n = Math.floor(len * sr);
  const out = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) out[i] += d[i0 + i] || 0;
  }
  return out;
}

function correlation(a, b) {
  let ma = 0, mb = 0;
  for (let i = 0; i < a.length; i++) { ma += a[i]; mb += b[i]; }
  ma /= a.length; mb /= b.length;
  let sab = 0, saa = 0, sbb = 0;
  for (let i = 0; i < a.length; i++) { const x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; }
  return sab / Math.sqrt(saa * sbb || 1);
}

const r4 = (x) => (x == null ? null : Math.round(x * 10000) / 10000);
function add(row) {
  results.push(row);
  const tr = document.createElement('tr');
  const cls = row.ok ? (row.warn ? 'warn' : 'ok') : 'bad';
  tr.innerHTML = `<td>${row.kind}</td><td>${row.name}</td><td class="num">${row.duration?.toFixed(3) ?? '-'}</td>` +
    `<td class="num">${row.peak?.toFixed(3) ?? '-'}</td><td class="num">${row.rms?.toFixed(4) ?? '-'}</td>` +
    `<td>${row.nan ? 'yes' : 'no'}</td><td class="${cls}">${row.ok ? (row.warn ? 'warn' : 'ok') : 'FAIL'}</td><td>${row.note || ''}</td>`;
  tbody.appendChild(tr);
}

async function checkSfx(name) {
  const buf = await audio.renderOffline('sfx', name, 2.5);
  if (!buf) return add({ kind: 'sfx', name, ok: false, note: 'render returned null' });
  const all = stats(buf);
  const dur = all.end;
  const s = stats(buf, 0, Math.max(dur, 0.01));
  const long = dur >= 1.2;
  const ok = !s.nan && s.peak <= 1 && s.rms > SFX_MIN_RMS && (!long || LONG_OK.has(name));
  add({ kind: 'sfx', name, duration: r4(dur), peak: r4(s.peak), rms: r4(s.rms), nan: s.nan, ok, warn: long, note: long ? 'long (allowed)' : '' });
}

async function checkMusic(name) {
  const info = trackInfo(name);
  const buf = await audio.renderOffline('music', name, 8);
  if (!buf) return add({ kind: 'music', name, ok: false, note: 'render returned null' });
  const s = stats(buf);
  const gap = longestGap(buf, 0, info.loop ? buf.duration : Math.min(buf.duration, s.end));
  const ok = !s.nan && s.peak <= 1 && s.rms > MUSIC_MIN_RMS && info.mismatch.length === 0 && gap <= 0.15;
  add({
    kind: 'music', name, duration: r4(buf.duration), peak: r4(s.peak), rms: r4(s.rms), nan: s.nan, ok,
    note: `${info.bpm} bpm, ${info.key}, intro ${info.introSec.toFixed(2)} s, loop ${info.loopSec.toFixed(2)} s (${info.loopBars} bars)${info.loop ? '' : ', one-shot'}; longest gap ${gap.toFixed(2)} s${info.mismatch.length ? ' MISMATCH ' + info.mismatch.join('; ') : ''}`,
  });
  if (!info.loop) {
    // One-shot jingle: render it whole and report its real length.
    const full = await audio.renderOffline('music', name, info.loopSec + 3);
    const f = stats(full);
    add({ kind: 'jingle', name, duration: r4(f.end), peak: r4(f.peak), rms: r4(stats(full, 0, f.end).rms), nan: f.nan, ok: !f.nan && f.peak <= 1 && f.end > 2 && f.end < 9, note: 'whole jingle; ends (-60 dB) at the duration shown' });
    return;
  }
  // Loop seam: start 3 s before the loop point (via the same Sequencer, seeking) and render 7 s.
  const loopAt = info.introSec + info.loopSec;
  const seam = await audio.renderOffline('music', name, 7, { from: loopAt - 3 });
  const pre = stats(seam, 0, 3), post = stats(seam, 3, 7);
  const seamGap = longestGap(seam);
  add({
    kind: 'loop', name, duration: r4(seam.duration), peak: r4(Math.max(pre.peak, post.peak)), rms: r4(post.rms), nan: pre.nan || post.nan,
    ok: !pre.nan && !post.nan && post.rms > MUSIC_MIN_RMS && pre.rms > MUSIC_MIN_RMS && Math.max(pre.peak, post.peak) <= 1 && seamGap <= 0.15,
    note: `seam at ${loopAt.toFixed(2)} s; rms before ${pre.rms.toFixed(4)}, after ${post.rms.toFixed(4)}; longest gap ${seamGap.toFixed(2)} s`,
  });
}

// One full straight render past the loop point (no seeking): the scheduler wraps on its own.
async function fullLoop(name) {
  const info = trackInfo(name);
  const loopAt = info.introSec + info.loopSec;
  const t0 = performance.now();
  const buf = await audio.renderOffline('music', name, loopAt + 6);
  const ms = performance.now() - t0;
  const all = stats(buf), after = stats(buf, loopAt, loopAt + 6);
  const c = correlation(mono(buf, info.introSec + 0.5, 4), mono(buf, loopAt + 0.5, 4));
  const gap = longestGap(buf);
  add({
    kind: 'fullloop', name, duration: r4(buf.duration), peak: r4(all.peak), rms: r4(after.rms), nan: all.nan,
    ok: !all.nan && all.peak <= 1 && after.rms > MUSIC_MIN_RMS && c > 0.8 && gap <= 0.15,
    note: `straight ${buf.duration.toFixed(1)} s render (${(ms / 1000).toFixed(1)} s); rms after loop point ${after.rms.toFixed(4)}; pass 1 vs pass 2 correlation ${c.toFixed(3)}; longest gap ${gap.toFixed(2)} s`,
  });
}

// Whole-song dropout scan for a looping track: overlapping 12 s chunks (seeking with `from`), each
// scanned after a 3 s lead-in so notes begun before the seek point can't read as gaps.
async function scanGaps(name) {
  const info = trackInfo(name);
  const total = info.introSec + info.loopSec + 2;
  let worst = 0, at = 0, peak = 0, nan = false;
  for (let pos = 0; pos < total; pos += 9) {
    const from = Math.max(0, pos - 3);
    const buf = await audio.renderOffline('music', name, 12, { from });
    const skip = pos - from;
    const g = longestGap(buf, skip, buf.duration);
    const st = stats(buf, skip);
    peak = Math.max(peak, st.peak);
    nan = nan || st.nan;
    if (g > worst) { worst = g; at = pos; }
  }
  add({ kind: 'gaps', name, duration: r4(total), peak: r4(peak), nan, ok: !nan && peak <= 1 && worst <= 0.15, note: `whole intro+loop scanned; longest gap ${worst.toFixed(2)} s${worst ? ` (chunk at ${at.toFixed(0)} s)` : ''}` });
}

// Click-to-listen buttons (live playback; the first click unlocks audio).
const listen = document.getElementById('listen');
for (const t of [...TRACK_NAMES, null]) {
  const b = document.createElement('button');
  b.textContent = t ? `music: ${t}` : 'music: stop';
  b.onclick = () => { audio.unlock(); audio.music(t); };
  listen.appendChild(b);
}
listen.appendChild(document.createElement('br'));
for (const n of SFX_NAMES) {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => { audio.unlock(); audio.play(n); };
  listen.appendChild(b);
}

// Live path (?live=1, needs autoplay permission, e.g. --autoplay-policy=no-user-gesture-required):
// the real AudioContext, the setInterval lookahead scheduler, track switching, mute and SFX throttle.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function live() {
  const row = (name, ok, note) => add({ kind: 'live', name, ok, note });
  audio.unlock();
  for (let i = 0; i < 40 && audio.debug().state !== 'running'; i++) await sleep(50);
  if (audio.debug().state !== 'running') return row('context', false, `state ${audio.debug().state}`);
  audio.debug(); // attaches the meter
  audio.music('battle');
  await sleep(1500);
  let d = audio.debug();
  row('music battle', d.playing && d.level.rms > 0.01, `rms ${d.level.rms.toFixed(4)} peak ${d.level.peak.toFixed(3)} t=${d.time.toFixed(2)}`);
  const id = d.seqId;
  audio.music('battle');
  await sleep(100);
  row('same track no restart', audio.debug().seqId === id, `seqId ${id} -> ${audio.debug().seqId}`);
  audio.music('boss');
  await sleep(1200);
  d = audio.debug();
  row('switch to boss', d.seqId === id + 1 && d.track === 'boss' && d.level.rms > 0.01, `rms ${d.level.rms.toFixed(4)}`);
  audio.setMuted(true);
  await sleep(400);
  d = audio.debug();
  row('mute', audio.muted && d.level.peak < 0.002, `peak ${d.level.peak.toFixed(5)}`);
  audio.setMuted(false);
  audio.music(null);
  await sleep(900);
  d = audio.debug();
  row('music(null) stops', !d.playing && d.level.peak < 0.01, `peak ${d.level.peak.toFixed(5)}`);
  for (let i = 0; i < 10; i++) audio.play('hit');
  const v1 = audio.debug().voices;
  await sleep(40);
  audio.play('hit');
  const v2 = audio.debug().voices;
  row('sfx throttle', v1 === 1 && v2 === 2, `10 calls at once -> ${v1} voice; +1 after 40 ms -> ${v2}`);
  audio.play('cannon');
  await sleep(60);
  d = audio.debug();
  row('sfx live output', d.level.peak > 0.02, `peak ${d.level.peak.toFixed(3)}`);
  audio.play('no-such-sound');
  row('unknown sfx ignored', true, 'no throw');
  audio.music('victory');
  await sleep(6500);
  d = audio.debug();
  row('jingle ends', !d.playing && d.level.peak < 0.01, `playing=${d.playing} peak ${d.level.peak.toFixed(4)}`);
  audio.music('menu');
  await sleep(800);
  row('music after jingle', audio.debug().playing && audio.debug().level.rms > 0.005, `rms ${audio.debug().level.rms.toFixed(4)}`);
  audio.music(null);
}

try {
  if (new URLSearchParams(location.search).has('live')) await live();
  for (const n of SFX_NAMES) await checkSfx(n);
  for (const t of TRACK_NAMES) await checkMusic(t);
  await fullLoop('battle');
  for (const t of TRACK_NAMES) if (trackInfo(t).loop) await scanGaps(t);
  const unknown = await audio.renderOffline('sfx', 'definitely-not-a-sound', 1);
  add({ kind: 'api', name: 'unknown sfx', ok: unknown === null, note: 'renderOffline of an unknown name resolves to null' });
} catch (e) {
  add({ kind: 'error', name: String(e && e.message || e), ok: false });
}
const failed = results.filter((r) => !r.ok);
document.getElementById('status').textContent = `${results.length} checks, ${failed.length} failed.`;
window.__results = results;
window.__ready = true;
</script>
</body>
</html>
