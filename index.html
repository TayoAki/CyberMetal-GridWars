<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="CyberMetal GridWars: a fights-only real-time grid battle game.">
<title>CyberMetal GridWars</title>
<style>
  /* One deliberate visual world: a dark arcade cabinet around a 240x160 GBA-sized screen. */
  :root {
    --bg: #05070f;
    --ink: #cfd8ff;
    --muted: #6f7fb8;
    --frame: #1a2550;
    --glow: rgba(40, 80, 200, 0.25);
    --btn: #18224a;
    --btn-edge: #2c3d80;
    --btn-on: #3a54b0;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; padding-inline: 16px; box-sizing: border-box; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; min-width: 0; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; background: #000; box-shadow: 0 0 0 2px var(--frame), 0 10px 40px var(--glow); outline: none; }
  #screen:focus-visible { box-shadow: 0 0 0 2px #8ab0ff, 0 10px 40px var(--glow); }
  #touch { display: none; width: 100%; max-width: 520px; padding-bottom: 12px; box-sizing: border-box; }
  body.touch #touch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .dpad { position: relative; width: 132px; height: 132px; }
  .dpad button { position: absolute; width: 44px; height: 44px; }
  .dpad .up { left: 44px; top: 0; } .dpad .down { left: 44px; bottom: 0; } .dpad .left { left: 0; top: 44px; } .dpad .right { right: 0; top: 44px; }
  .mid { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .ab { position: relative; width: 132px; height: 120px; justify-self: end; }
  .ab .a { position: absolute; right: 0; top: 10px; width: 58px; height: 58px; border-radius: 50%; }
  .ab .b { position: absolute; left: 4px; top: 52px; width: 58px; height: 58px; border-radius: 50%; }
  .shoulders { display: flex; gap: 8px; }
  #touch button { background: var(--btn); color: var(--ink); border: 2px solid var(--btn-edge); border-radius: 10px; font: 700 14px system-ui, sans-serif; touch-action: none; }
  #touch button.on { background: var(--btn-on); }
  #touch button:focus-visible { outline: 2px solid #8ab0ff; }
  .small { width: 64px; height: 34px; font-size: 11px !important; }
  #hint { font: 12px system-ui, sans-serif; color: var(--muted); text-align: center; text-wrap: balance; }
  body.touch #hint { display: none; }
  @media (prefers-reduced-motion: reduce) { #screen { box-shadow: 0 0 0 2px var(--frame); } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="240" height="160" tabindex="0" aria-label="CyberMetal GridWars game screen. Click to focus, then use the keyboard."></canvas>
  <div id="touch" aria-hidden="true">
    <div class="dpad">
      <button class="up" data-btn="up">▲</button>
      <button class="left" data-btn="left">◀</button>
      <button class="right" data-btn="right">▶</button>
      <button class="down" data-btn="down">▼</button>
    </div>
    <div class="mid">
      <div class="shoulders"><button class="small" data-btn="l">L</button><button class="small" data-btn="r">R</button></div>
      <div class="shoulders"><button class="small" data-btn="select">SELECT</button><button class="small" data-btn="start">START</button></div>
    </div>
    <div class="ab">
      <button class="a" data-btn="a">A</button>
      <button class="b" data-btn="b">B</button>
    </div>
  </div>
  <div id="hint">Click the screen, then: Arrows move · Z buster (hold to charge) · X chip / confirm · Q/E Custom · Enter start/pause</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
